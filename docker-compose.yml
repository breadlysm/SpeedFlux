version: "3.9"
services:
  speedflux:
    build: .
    environment:
        - NAMESPACE=None
        # Backend selection: influxdb, victoriametrics, prometheus (comma-separated)
        # Default: influxdb (for backward compatibility)
        - SPEEDFLUX_BACKENDS=influxdb
        # InfluxDB settings
        - INFLUX_DB_ADDRESS=[ip or hostname]
        - INFLUX_DB_PORT=8086
        - INFLUX_DB_USER=[db username]
        - INFLUX_DB_PASSWORD=[db password]
        - INFLUX_DB_DATABASE=speedtest
        - INFLUX_DB_TAGS= # See https://github.com/breadlysm/speedtest-to-influxdb#tag-options for details
        # VictoriaMetrics settings (if using victoriametrics backend)
        # - VICTORIAMETRICS_ADDRESS=victoriametrics
        # - VICTORIAMETRICS_PORT=8428
        # - VICTORIAMETRICS_DATABASE=speedtests
        # Prometheus settings (if using prometheus backend)
        # - PROMETHEUS_PORT=9091
        # Speedtest settings
        - SPEEDTEST_INTERVAL=150 # Minutes between speedtest updates
        - PING_INTERVAL=60 # Seconds between ping updates
        - PING_TARGETS=1.1.1.1, 8.8.8.8 # csv of hostnames to ping
        - LOG_TYPE=info
    # Expose Prometheus metrics port if using prometheus backend
    # ports:
    #   - "9091:9091"
    image: speedflux

